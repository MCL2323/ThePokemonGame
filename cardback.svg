<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880">
  <defs>
    <!-- nuages bleus tourbillonnants -->
    <filter id="swirl" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.25  0 0 0 0 0.62  1.6 0 0 0 -0.35" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="glow" cx="45%" cy="45%" r="65%">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset=".45" stop-color="#2a63c9"/>
      <stop offset="1" stop-color="#0d2466"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b56b8"/>
      <stop offset=".5" stop-color="#1f4398"/>
      <stop offset="1" stop-color="#16337a"/>
    </linearGradient>
    <radialGradient id="red" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset=".5" stop-color="#e3262e"/>
      <stop offset="1" stop-color="#8f0f16"/>
    </radialGradient>
    <radialGradient id="white" cx="40%" cy="70%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e6e6ea"/>
      <stop offset="1" stop-color="#9b9ba6"/>
    </radialGradient>
    <clipPath id="field"><rect x="34" y="34" width="562" height="812" rx="22"/></clipPath>
  </defs>

  <!-- bordure bleue -->
  <rect width="630" height="880" rx="34" fill="url(#border)"/>
  <rect x="10" y="10" width="610" height="860" rx="28" fill="none" stroke="#4d7ad6" stroke-width="3" opacity=".6"/>

  <!-- fond : dégradé + tourbillons -->
  <g clip-path="url(#field)">
    <rect x="34" y="34" width="562" height="812" fill="url(#glow)"/>
    <rect x="34" y="34" width="562" height="812" fill="#fff" filter="url(#swirl)" opacity=".9"/>
    <ellipse cx="300" cy="420" rx="330" ry="250" fill="#7fb6ff" opacity=".18" transform="rotate(-25 300 420)"/>
  </g>
  <rect x="34" y="34" width="562" height="812" rx="22" fill="none" stroke="#0b1d55" stroke-width="5"/>

  <!-- Poké Ball penchée -->
  <g transform="translate(300 430) rotate(-22)">
    <circle r="186" fill="#111a33"/>
    <path d="M-170 0 A170 170 0 0 1 170 0 Z" fill="url(#red)"/>
    <path d="M-170 0 A170 170 0 0 0 170 0 Z" fill="url(#white)"/>
    <rect x="-172" y="-15" width="344" height="30" fill="#111a33"/>
    <circle r="52" fill="#111a33"/>
    <circle r="34" fill="url(#white)" stroke="#59596a" stroke-width="3"/>
    <circle r="14" fill="none" stroke="#9b9ba6" stroke-width="3"/>
    <ellipse cx="-70" cy="-105" rx="48" ry="22" fill="#fff" opacity=".35" transform="rotate(-25 -70 -105)"/>
  </g>

  <!-- inscription jaune -->
  <g transform="translate(320 455) rotate(-14)">
    <text text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="128" letter-spacing="-4"
      fill="#ffcb05" stroke="#2a5aa8" stroke-width="22" paint-order="stroke" stroke-linejoin="round">Pokémon</text>
    <text text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="128" letter-spacing="-4"
      fill="none" stroke="#1a3c80" stroke-width="5" paint-order="stroke" opacity=".6">Pokémon</text>
  </g>
</svg>
