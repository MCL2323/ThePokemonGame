<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pokémon Collector</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header>
  <h1>⚡ Pokémon Collector</h1>
  <div class="stat">💰 <span id="points">0</span> pts</div>
  <div class="progress"><div id="bar"></div><span id="barText"></span></div>
  <button class="gold" id="wheelBtn"></button>
  <button id="hdrExport" data-t="export"></button>
  <button id="hdrImport" data-t="import"></button>
  <select id="langSel" class="hdrsel" title="Langue / Sprache / Language"></select>
  <button id="soundBtn" class="iconbtn" title="Sons / Töne / Sounds">🔊</button>
</header>
<nav>
  <button data-tab="room" class="on" data-t="nav.room"></button>
  <button data-tab="shop" data-t="nav.shop"></button>
  <button data-tab="coll" data-t="nav.coll"></button>
  <button data-tab="opt" data-t="nav.opt"></button>
</nav>
<main>
  <section id="room" class="on">
    <div class="room" id="roomScene"></div>
    <div class="roomfoot">
      <span class="muted" data-t="room.foot"></span>
      <button id="resetPos" data-t="room.reset"></button>
    </div>
  </section>

  <section id="shop">
    <div class="store shopwrap" id="shopWrap">
      <!-- dehors : la rue et la devanture -->
      <div class="street" id="street">
        <div class="sky"><i></i><i></i></div>
        <div class="building">
          <div class="shopsign">POKÉ SHOP</div>
          <div class="awning2"></div>
          <div class="facade">
            <div class="shopwindow"><img src="art/25.png" alt=""><img src="art/6.png" alt=""><div class="winsale">NEU · NEW · NOUVEAU</div></div>
            <div class="door" id="shopDoor"><div class="doorpanel"><div class="doorglass"><span class="opensign" data-t="shop.open"></span></div><div class="handle"></div></div></div>
            <div class="shopwindow"><img src="art/150.png" alt=""><img src="art/133.png" alt=""><div class="winsale">★ GOD PACKS ★</div></div>
          </div>
        </div>
        <div class="sidewalk"></div>
        <div class="streethint" data-t="shop.enter"></div>
      </div>
      <!-- dedans : 4 murs, on se promène de l'un à l'autre -->
      <div class="inside" id="inside">
        <div class="pano" id="pano">
          <div class="wall2 w-boosters"><div class="rack"><div class="items" id="shelfBoosters"></div></div></div>
          <div class="wall2 w-boxes">
            <div class="vitrine"><div class="items" id="shelfBoxes"></div></div>
            <div class="counter">
              <img src="art/352.png" alt="">
              <div class="register"><div class="screen" id="regScreen">0</div><div class="keys"></div></div>
            </div>
          </div>
          <div class="wall2 w-furniture"><div class="rack"><div class="items" id="shelfFurniture"></div></div></div>
          <div class="wall2 w-figures"><div class="vitrine"><div class="items" id="shelfFigures"></div></div></div>
        </div>
        <button class="navbtn prev" id="wallPrev">◀</button>
        <button class="navbtn next" id="wallNext">▶</button>
        <div class="wallname" id="wallName"></div>
        <button class="exitbtn" id="exitShop" data-t="shop.exit"></button>
      </div>
      <div class="shoptalk"><img src="art/352.png" alt=""><div class="bubble" id="shopTalk"></div><span class="muted walkhint" data-t="shop.walk"></span></div>
    </div>
  </section>

  <section id="coll">
    <div class="filters">
      <input id="search" data-t-ph="search" style="flex:1;min-width:140px">
      <select id="fOwn"></select>
      <select id="fSet"></select>
      <select id="fTier"></select>
      <select id="fMech"></select>
      <select id="fCat"></select>
      <select id="fGen"></select>
      <button class="green" id="sellMode" data-t="sell.mode"></button>
    </div>
    <p class="muted" id="collInfo"></p>
    <div class="grid" id="collGrid"></div>
    <div class="sellbar" id="sellBar">
      <div><span id="sellCount"></span> · <b id="sellGain">+0 pts</b><br><span class="muted" style="font-size:13px" data-t="sell.hint"></span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="selDups" data-t="sell.dups"></button>
        <button id="selClear" data-t="sell.clear"></button>
        <button class="green" id="sellGo" data-t="sell.go"></button>
        <button class="red" id="sellExit">✖</button>
      </div>
    </div>
  </section>

  <section id="opt">
    <div class="box settings">
      <label><span data-t="opt.lang"></span> <select id="optLang"></select></label>
      <label><span data-t="opt.sound"></span> <button id="optSound"></button></label>
    </div>
    <div class="box">
      <h3 style="margin-top:0" data-t="opt.saveTitle"></h3>
      <p class="muted" data-t="opt.saveText"></p>
      <button class="green" id="exportBtn" data-t="export"></button>
      <button id="importBtn" data-t="import"></button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
    <div class="box">
      <h3 style="margin-top:0" data-t="opt.stats"></h3>
      <div id="stats"></div>
    </div>
    <div class="box">
      <h3 style="margin-top:0" data-t="opt.rules"></h3>
      <ul class="muted" style="margin:0" id="rules"></ul>
    </div>
    <div class="box">
      <button class="red" id="resetBtn" data-t="opt.reset"></button>
    </div>
  </section>
</main>

<!-- Détail d'une carte -->
<div class="modal" id="cardModal">
  <div class="panel">
    <div class="zoom" id="zoom"><div class="tilt" id="tilt"><img id="zoomImg" alt=""><div class="holo" id="holo"></div></div></div>
    <div class="info" id="cardInfo"></div>
  </div>
</div>

<!-- Achat -->
<div class="modal" id="buyModal">
  <div class="panel" style="max-width:560px;flex-direction:column;align-items:center;text-align:center" id="buyPanel"></div>
</div>

<!-- Roue du jour -->
<div class="modal" id="wheelModal">
  <div class="panel" style="max-width:520px;flex-direction:column;align-items:center;text-align:center" id="wheelPanel"></div>
</div>

<!-- Ouverture d'un booster ou d'un coffret -->
<div id="opening"></div>

<div class="toast" id="toast"></div>

<script src="i18n.js?v=6"></script>
<script src="sound.js?v=6"></script>
<script src="data.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
